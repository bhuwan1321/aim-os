name: aim-os

# Everything AIM OS stores (databases, AI models, voices) lives in ${AIM_DATA:-./data}
# inside this folder. Nothing is written to the host's home directory.

networks:
  aim-network:
    driver: bridge

x-service: &service
  restart: unless-stopped
  env_file: .env
  networks: [aim-network]
  extra_hosts:
    - "host.docker.internal:host-gateway"

x-pyhealth: &pyhealth
  interval: 15s
  timeout: 5s
  retries: 5
  start_period: 20s

services:

  # ── Infrastructure ──────────────────────────────

  redis:
    image: redis:7-alpine
    container_name: aim-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    ports: ["127.0.0.1:6379:6379"]
    volumes: ["${AIM_DATA:-./data}/redis:/data"]
    networks: [aim-network]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  postgres:
    image: postgres:16-alpine
    container_name: aim-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - ${AIM_DATA:-./data}/postgres:/var/lib/postgresql/data
      - ./infra/sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks: [aim-network]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.9.7
    container_name: aim-qdrant
    restart: unless-stopped
    ports: ["127.0.0.1:6333:6333", "127.0.0.1:6334:6334"]
    volumes: ["${AIM_DATA:-./data}/qdrant:/qdrant/storage"]
    networks: [aim-network]
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ── Local AI models (stored in ./data/ollama) ───

  ollama:
    image: ollama/ollama:latest
    container_name: aim-ollama
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: "-1"
      OLLAMA_MAX_LOADED_MODELS: "2"
    ports: ["127.0.0.1:11435:11434"]
    volumes: ["aim-ollama-models:/root/.ollama"]
    networks: [aim-network]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 10s

  ollama-init:
    image: ollama/ollama:latest
    container_name: aim-ollama-init
    restart: "no"
    depends_on:
      ollama: { condition: service_healthy }
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      OLLAMA_SCREEN_MODEL: ${OLLAMA_SCREEN_MODEL:-gemma3:4b}
      OLLAMA_OFFLINE_MODEL: ${OLLAMA_OFFLINE_MODEL:-qwen3:4b}
    volumes: ["aim-ollama-models:/root/.ollama"]
    networks: [aim-network]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for m in "$$OLLAMA_EMBED_MODEL" "$$OLLAMA_OFFLINE_MODEL" "$$OLLAMA_SCREEN_MODEL"; do
          echo "[aim] ensuring model $$m"; ollama pull "$$m" || echo "[aim] could not pull $$m (will retry next start)"
        done
        echo "[aim] models ready"

  # ── Core ────────────────────────────────────────

  llm-router:
    <<: *service
    build: ./core/llm-router
    container_name: aim-llm-router
    ports: ["127.0.0.1:8001:8001"]
    # gemini-2.5-flash / 2.0-flash were retired by Google; these override the older names in .env
    environment:
      GEMINI_RESEARCH_MODEL: gemini-3.5-flash
      GEMINI_THINK_MODEL: gemini-3.5-flash
      GEMINI_VISION_MODEL: gemini-3.5-flash
    depends_on:
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u;u.urlopen('http://localhost:8001/health')"]
      <<: *pyhealth

  memory:
    <<: *service
    build: ./core/memory
    container_name: aim-memory
    ports: ["127.0.0.1:8003:8003"]
    depends_on:
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }
      qdrant: { condition: service_healthy }
      ollama: { condition: service_healthy }
    volumes: ["${AIM_DATA:-./data}/memory:/app/storage"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u;u.urlopen('http://localhost:8003/health')"]
      <<: *pyhealth

  brain:
    <<: *service
    build: ./core/brain
    container_name: aim-brain
    ports: ["127.0.0.1:8004:8004"]
    depends_on:
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }
      qdrant: { condition: service_healthy }
    volumes: ["${AIM_DATA:-./data}/brain:/app/memory"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u;u.urlopen('http://localhost:8004/health')"]
      <<: *pyhealth

  # ── Agents ──────────────────────────────────────

  research-agent:
    <<: *service
    build: ./agents/research
    container_name: aim-research-agent
    ports: ["127.0.0.1:8005:8005"]
    environment:
      GEMINI_RESEARCH_MODEL: gemini-3.5-flash
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u;u.urlopen('http://localhost:8005/health')"]
      <<: *pyhealth
    depends_on:
      redis: { condition: service_healthy }
    # Projects the Research Center can open (read-only): this AIM OS folder, and AIM_PROJECTS (default ./workspace)
    volumes:
      - ./:/projects/aim-os:ro
      - ${AIM_PROJECTS:-./workspace}:/projects/workspace   # writable: git clones land here

  browser-agent:
    <<: *service
    build: ./agents/browser
    container_name: aim-browser-agent
    ports: ["127.0.0.1:8007:8007"]
    shm_size: 1gb
    depends_on:
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u;u.urlopen('http://localhost:8007/health')"]
      <<: *pyhealth

  voice-agent:
    <<: *service
    build: ./agents/voice
    container_name: aim-voice-agent
    ports: ["127.0.0.1:8008:8008"]
    volumes: ["${AIM_DATA:-./data}/voice:/data"]
    depends_on:
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u;u.urlopen('http://localhost:8008/health')"]
      <<: *pyhealth
      start_period: 90s

  # ── Services ────────────────────────────────────

  timeline:
    <<: *service
    build: ./services/timeline
    container_name: aim-timeline
    ports: ["127.0.0.1:8002:8002"]
    depends_on:
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u;u.urlopen('http://localhost:8002/health')"]
      <<: *pyhealth

  notification:
    <<: *service
    build: ./services/notification
    container_name: aim-notification
    ports: ["127.0.0.1:8006:8006"]
    depends_on:
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u;u.urlopen('http://localhost:8006/health')"]
      <<: *pyhealth

  # ── Dashboard (JARVIS UI) ───────────────────────

  dashboard:
    <<: *service
    build:
      context: ./apps/aim-ui
    container_name: aim-dashboard
    ports: ["127.0.0.1:8888:8888"]
    depends_on: [timeline, brain]

volumes:
  aim-ollama-models:
